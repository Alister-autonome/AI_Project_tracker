name: Build Mac (.pkg) & Windows (.exe) Installers

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-mac-pkg:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject Repository URL into Mac Launcher
        run: |
          sed -i '' "s|https://github.com/YOUR_GITHUB_USERNAME/mac-job-filler.git|https://github.com/${{ github.repository }}.git|g" launcher.sh

      - name: Stage Package Payload & macOS App Bundle
        run: |
          mkdir -p pkg_root/Users/Shared/JobFiller
          mkdir -p "pkg_root/Applications/Job Filler.app/Contents/MacOS"
          mkdir -p scripts

          cp profile.example.md app.py launcher.sh README.md pkg_root/Users/Shared/JobFiller/
          mkdir -p pkg_root/Users/Shared/JobFiller/.streamlit
          cp .streamlit/config.toml pkg_root/Users/Shared/JobFiller/.streamlit/
          chmod +x pkg_root/Users/Shared/JobFiller/launcher.sh

          cat << 'EOF' > "pkg_root/Applications/Job Filler.app/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>JobFiller</string>
              <key>CFBundleIdentifier</key>
              <string>com.opensource.jobfiller</string>
              <key>CFBundleName</key>
              <string>Job Hunter</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>2.0</string>
          </dict>
          </plist>
          EOF

          cat << 'EOF' > "pkg_root/Applications/Job Filler.app/Contents/MacOS/JobFiller"
          #!/bin/bash
          osascript -e 'tell application "Terminal" to activate' -e 'tell application "Terminal" to do script "bash \"$HOME/Desktop/JobFiller/launcher.sh\""'
          EOF
          chmod +x "pkg_root/Applications/Job Filler.app/Contents/MacOS/JobFiller"

          cat << 'EOF' > scripts/postinstall
          #!/bin/bash
          CURRENT_USER=$(stat -f "%Su" /dev/console)
          TARGET_DIR="/Users/$CURRENT_USER/Desktop/JobFiller"
          mkdir -p "$TARGET_DIR"

          cp -f /Users/Shared/JobFiller/profile.example.md "$TARGET_DIR/"
          if [ ! -f "$TARGET_DIR/profile.md" ]; then
              cp /Users/Shared/JobFiller/profile.example.md "$TARGET_DIR/profile.md"
          fi
          cp -f /Users/Shared/JobFiller/app.py "$TARGET_DIR/"
          cp -f /Users/Shared/JobFiller/launcher.sh "$TARGET_DIR/"
          cp -f /Users/Shared/JobFiller/README.md "$TARGET_DIR/"
          mkdir -p "$TARGET_DIR/.streamlit"
          cp -f /Users/Shared/JobFiller/.streamlit/config.toml "$TARGET_DIR/.streamlit/"

          chmod +x "$TARGET_DIR/launcher.sh"
          chown -R "$CURRENT_USER":staff "$TARGET_DIR"
          chown -R "$CURRENT_USER":staff "/Applications/Job Filler.app"
          xattr -cr "$TARGET_DIR" "/Applications/Job Filler.app" 2>/dev/null || true
          ln -sf "/Applications/Job Filler.app" "/Users/$CURRENT_USER/Desktop/Job Filler.app"
          chown -h "$CURRENT_USER":staff "/Users/$CURRENT_USER/Desktop/Job Filler.app"
          EOF
          chmod +x scripts/postinstall

      - name: Compile JobFiller.pkg
        run: |
          pkgbuild --root ./pkg_root \
                   --scripts ./scripts \
                   --identifier com.opensource.jobfiller \
                   --version 2.0.${{ github.run_number }} \
                   --install-location / \
                   JobFiller.pkg

      - name: Upload Mac PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JobFiller-Mac-Installer
          path: JobFiller.pkg

  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject Repository URL into Windows Launcher
        shell: pwsh
        run: |
          (Get-Content launcher.bat) -replace 'https://github.com/YOUR_GITHUB_USERNAME/mac-job-filler.git', "https://github.com/${{ github.repository }}.git" | Set-Content launcher.bat

      - name: Compile JobFiller-Setup.exe with Inno Setup
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JobFiller-Windows-Installer
          path: Output/JobFiller-Setup.exe

  release:
    needs: [build-mac-pkg, build-windows-exe]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Move the 'latest' tag to this commit
        run: |
          git tag -f latest "${{ github.sha }}"
          git push -f origin latest

      - name: Download All Built Installers
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish Both Installers to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Job Hunter 2.2 — Claude or ChatGPT, macOS & Windows"
          body: |
            Your own job-search assistant, powered by **your Claude or ChatGPT account**, running only on your computer.

            ## ⬇️ Install
            - **🍎 Mac:** download **`JobFiller.pkg`** below → right-click it → **Open** (macOS asks once because it isn't from the App Store).
            - **🪟 Windows:** download **`JobFiller-Setup.exe`** below → run it. If SmartScreen appears, click **More info → Run anyway**.

            Then open **Job Hunter** from your Desktop. It installs what it needs and opens in your browser at `http://localhost:8501`.

            ## 🚀 First run (about 5 minutes)
            1. **Choose your AI:** Claude (Pro or Max plan) or ChatGPT (any plan, including Free).
            2. Click **Install**, then **Sign in**. Your browser opens; sign in and come back. If your plan can't be used, Job Hunter tells you why and what to do.
            3. Add your details and resume. Then use **Profile → Build my profile from context** with your ChatGPT or LinkedIn export, and check **Don't claim** so your AI never says you've used a tool you haven't.

            ## ✨ What's in this release
            - 🔀 **Claude or ChatGPT:** pick at setup, switch from the sidebar any time. Every feature works on both.
            - 📊 **Tracker first:** pipeline summary, follow-up reminders, contacts, search, and edits that save automatically.
            - 🤖 **Auto-Apply:** fills applications in Chrome from your profile and **stops before Submit**.
            - ✉️ **Cover letters (Word download), LinkedIn messages and fit checks**, in your voice, using only what's true.
            - 🧠 **New: profile from context.** Drop in a ChatGPT data export, a LinkedIn export or old resumes, and your AI drafts your whole profile from them (facts only, with gaps flagged).
            - 💬 **Ask AI:** a job-search coach that knows your background.
            - 📈 **Usage:** plan limits (5-hour and weekly) and tokens per request.
            - 🔒 **Locked down:** localhost only, no shell or code tools for the AI, job ads treated as untrusted text.

            Already installed? Just reopen Job Hunter. It updates itself.
          files: |
            dist/JobFiller-Mac-Installer/JobFiller.pkg
            dist/JobFiller-Windows-Installer/JobFiller-Setup.exe
          prerelease: false
